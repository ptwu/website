    <rect x="745" y="480" width="170" height="80" rx="12"/>
  </g>
  <g fill="#ecfeff" font-family="Arial, sans-serif" font-size="26" text-anchor="middle">
    <text x="170" y="530">a+b+c+d</text><text x="390" y="530">a+b+c+d</text>
    <text x="610" y="530">a+b+c+d</text><text x="830" y="530">a+b+c+d</text>
