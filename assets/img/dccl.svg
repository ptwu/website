    <rect x="305" y="220" width="170" height="80" rx="12"/>
    <rect x="525" y="220" width="170" height="80" rx="12"/>
    <rect x="745" y="220" width="170" height="80" rx="12"/>
  </g>
  <g fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" text-anchor="middle">
    <text x="170" y="270">a</text><text x="390" y="270">b</text>
    <text x="610" y="270">c</text><text x="830" y="270">d</text>
  </g>
  <rect x="385" y="354" width="230" height="72" rx="36" fill="#0369a1"/>
