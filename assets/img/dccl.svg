<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" fill="none">
  <rect width="1000" height="650" fill="#0f172a"/>
  <text x="64" y="105" fill="#f8fafc" font-family="Arial, sans-serif" font-size="54" font-weight="700">DCCL AllReduce</text>
  <text x="64" y="151" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">Collective communication over RDMA</text>
  <g stroke="#38bdf8" stroke-width="4">
